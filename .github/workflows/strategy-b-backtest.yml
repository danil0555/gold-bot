name: Strategy B historical backtest

on:
  push:
    branches: [research/strategy-b-historical-backtest]
  workflow_dispatch:

jobs:
  strategy-b-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install read-only backtest dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile sources
        run: python -m compileall -q .
      - name: Run deterministic tests
        run: python -m pytest -q tests/test_strategy_b_backtest.py tests/test_addon_strategies.py
      - name: Run 30-day Strategy B historical simulation
        run: python -m scripts.backtest_strategy_b --days 30 --warmup-days 60 --symbols BTC-USDT,ETH-USDT,SOL-USDT --source binance
        timeout-minutes: 40
