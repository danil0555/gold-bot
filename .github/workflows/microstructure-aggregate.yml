name: Aggregate multi-day BingX microstructure research

on:
  workflow_dispatch:
    inputs:
      capture_run_ids:
        description: "Comma-separated successful Read-only BingX capture run IDs (at least 2)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Verify research branch
        env:
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          test "$SELECTED_BRANCH" = "research/market-discovery-engine-v1"
          test -f scripts/merge_microstructure_databases.py
          test -f scripts/market_pattern_holdout.py
      - name: Validate capture run IDs
        id: ids
        env:
          RAW_IDS: ${{ inputs.capture_run_ids }}
        run: |
          python - <<'PY'
          import os, re
          ids = [item.strip() for item in os.environ["RAW_IDS"].split(",") if item.strip()]
          if len(ids) < 2 or len(ids) != len(set(ids)):
              raise SystemExit("Provide at least two distinct successful capture run IDs.")
          if any(not re.fullmatch(r"[0-9]{6,20}", item) for item in ids):
              raise SystemExit("Run IDs must be comma-separated numeric GitHub Actions run IDs.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("run_ids=" + " ".join(ids) + "\n")
          print(f"Validated {len(ids)} capture run IDs")
          PY
      - name: Download each raw capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/captures
          for run_id in ${{ steps.ids.outputs.run_ids }}; do
            mkdir -p "/tmp/captures/$run_id"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name bingx-microstructure-capture \
              --dir "/tmp/captures/$run_id"
          done
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Merge and deduplicate captures
        run: |
          mapfile -t DATABASES < <(find /tmp/captures -type f -name market_microstructure.sqlite3 | sort)
          test "${#DATABASES[@]}" -ge 2
          python -m scripts.merge_microstructure_databases \
            --inputs "${DATABASES[@]}" \
            --output /tmp/market_microstructure_merged.sqlite3 \
            --report /tmp/microstructure_merge_report.json
      - name: Check multi-day sample coverage
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("/tmp/market_microstructure_merged.sqlite3")
          count, first, last, days = db.execute("""
            SELECT COUNT(DISTINCT minute_ts), MIN(minute_ts), MAX(minute_ts),
                   COUNT(DISTINCT date(minute_ts / 1000, 'unixepoch'))
            FROM minute_candles WHERE is_closed = 1
          """).fetchone()
          db.close()
          print(f"Unique minutes: {count}; UTC dates: {days}; range: {first}..{last}")
          if count < 600 or days < 3:
              raise SystemExit("Need >=600 unique closed minutes across >=3 UTC dates. Capture more daily sessions first.")
          PY
      - name: Run pre-event discovery and frozen chronological holdout
        run: |
          python -m scripts.market_move_discovery \
            --db /tmp/market_microstructure_merged.sqlite3 \
            --output /tmp/market_move_discovery_multiday.json
          python -m scripts.market_pattern_mining \
            --db /tmp/market_microstructure_merged.sqlite3 \
            --output /tmp/market_patterns_multiday.json \
            --min-support 5
          python -m scripts.market_pattern_holdout \
            --db /tmp/market_microstructure_merged.sqlite3 \
            --output /tmp/market_pattern_holdout_multiday.json \
            --train-fraction 0.70 --min-support 5
      - name: Upload merged database and research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-microstructure-multiday-aggregate
          path: |
            /tmp/market_microstructure_merged.sqlite3
            /tmp/microstructure_merge_report.json
            /tmp/market_move_discovery_multiday.json
            /tmp/market_patterns_multiday.json
            /tmp/market_pattern_holdout_multiday.json
          retention-days: 30
          if-no-files-found: warn
