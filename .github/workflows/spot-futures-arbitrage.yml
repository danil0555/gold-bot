name: Spot-futures arbitrage research

on:
  push:
    branches: [research/spot-futures-arbitrage]
  workflow_dispatch:

concurrency:
  group: spot-futures-arbitrage-research
  cancel-in-progress: true

jobs:
  read-only-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile sources
        run: python -m compileall -q .
      - name: Run arbitrage calculation tests
        run: python -m pytest -q tests/test_spot_futures_arb.py
      - name: Run existing strategy B regression tests
        run: python -m pytest -q tests/test_strategy_b_backtest.py tests/test_addon_strategies.py
      - name: Run public-data read-only smoke scan
        run: python -m scripts.spot_futures_arb --symbols BTC-USDT,ETH-USDT,SOL-USDT --notional 1000 --funding-periods 3
        timeout-minutes: 5
