name: Read-only BingX microstructure capture

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Capture duration (2.5 to 4.5 hours; enough for rolling lookback)"
        required: true
        type: number
        default: 4
      symbols:
        description: "USDT-M symbols, comma-separated"
        required: true
        type: string
        default: "BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,ADA-USDT,DOGE-USDT,LINK-USDT"
      previous_capture_run_ids:
        description: "Optional comma-separated IDs of earlier successful capture runs to merge"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out directional research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Verify selected research branch and scripts
        env:
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          test "$SELECTED_BRANCH" = "research/market-discovery-engine-v1"
          test -f scripts/market_data_collector.py
          test -f scripts/microstructure_event_study.py
          test -f scripts/microstructure_discovery.py
          test -f scripts/microstructure_data_quality.py
          test -f scripts/market_move_discovery.py
          test -f scripts/merge_microstructure_databases.py
          git log -1 --format='Checked out commit: %h %s'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install read-only collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate capture settings
        env:
          DURATION_HOURS: ${{ inputs.duration_hours }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          python - <<'PY'
          import os
          hours = float(os.environ["DURATION_HOURS"])
          symbols = [s.strip() for s in os.environ["SYMBOLS"].split(",") if s.strip()]
          if not 2.5 <= hours <= 4.5:
              raise SystemExit("duration_hours must be between 2.5 and 4.5")
          if not 2 <= len(symbols) <= 20 or any(not s.endswith("-USDT") for s in symbols):
              raise SystemExit("Provide 2 to 20 USDT-M symbols")
          print(f"Validated read-only capture: {hours} hours, {len(symbols)} symbols")
          PY
      - name: Capture public BingX trades, depth, candles and derivatives
        run: |
          python -m scripts.market_data_collector \
            --symbols "${{ inputs.symbols }}" \
            --duration-hours "${{ inputs.duration_hours }}" \
            --derivatives-interval 30 \
            --db-path /tmp/market_microstructure.sqlite3
      - name: Build event-study report
        run: |
          python -m scripts.microstructure_event_study \
            --db /tmp/market_microstructure.sqlite3 \
            --cost-bps 12 \
            --output /tmp/microstructure_event_study.json
      - name: Discover event-agnostic microstructure features
        run: |
          python -m scripts.microstructure_discovery \
            --db /tmp/market_microstructure.sqlite3 \
            --cost-bps 12 \
            --output /tmp/microstructure_discovery.json
      - name: Discover pre-event market move conditions
        run: |
          python -m scripts.market_move_discovery \
            --db /tmp/market_microstructure.sqlite3 \
            --output /tmp/market_move_discovery.json
      - name: Upload pre-event market move discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-move-pre-event-discovery
          path: /tmp/market_move_discovery.json
          retention-days: 14
          if-no-files-found: warn
      - name: Audit capture data quality
        if: always()
        run: |
          if [ -f /tmp/market_microstructure.sqlite3 ]; then
            python -m scripts.microstructure_data_quality \
              --db /tmp/market_microstructure.sqlite3 \
              --output /tmp/microstructure_data_quality.json
          else
            echo "No capture database was produced; skipping quality audit."
          fi
      - name: Upload event-agnostic discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-microstructure-discovery
          path: /tmp/microstructure_discovery.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload data-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-microstructure-data-quality
          path: /tmp/microstructure_data_quality.json
          retention-days: 14
          if-no-files-found: warn
      - name: Validate and export previous run IDs
        id: previous_ids
        if: ${{ inputs.previous_capture_run_ids != '' }}
        env:
          RAW_IDS: ${{ inputs.previous_capture_run_ids }}
        run: |
          python - <<'PY'
          import os, re
          ids = [item.strip() for item in os.environ["RAW_IDS"].split(",") if item.strip()]
          if not ids or len(ids) != len(set(ids)) or any(not re.fullmatch(r"[0-9]{6,20}", item) for item in ids):
              raise SystemExit("Provide unique comma-separated numeric run IDs.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("run_ids=" + " ".join(ids) + "\n")
          print(f"Validated {len(ids)} previous capture runs")
          PY
      - name: Download earlier capture artifacts
        if: ${{ inputs.previous_capture_run_ids != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/previous-captures
          for run_id in ${{ steps.previous_ids.outputs.run_ids }}; do
            mkdir -p "/tmp/previous-captures/$run_id"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name bingx-microstructure-capture \
              --dir "/tmp/previous-captures/$run_id"
          done
      - name: Merge current and earlier captures
        run: |
          mkdir -p /tmp/previous-captures
          mapfile -t PREVIOUS_DATABASES < <(find /tmp/previous-captures -type f -name market_microstructure.sqlite3 | sort)
          python -m scripts.merge_microstructure_databases \
            --inputs /tmp/market_microstructure.sqlite3 "${PREVIOUS_DATABASES[@]}" \
            --output /tmp/market_microstructure_merged.sqlite3 \
            --report /tmp/microstructure_merge_report.json
      - name: Check merged sample coverage and run frozen holdout
        run: |
          ready=$(python - <<'PY'
          import sqlite3
          db = sqlite3.connect("/tmp/market_microstructure_merged.sqlite3")
          count, days = db.execute("""
            SELECT COUNT(DISTINCT minute_ts),
                   COUNT(DISTINCT date(minute_ts / 1000, 'unixepoch'))
            FROM minute_candles WHERE is_closed = 1
          """).fetchone()
          db.close()
          result = count >= 600 and days >= 3
          print(f"Coverage: {count} unique minutes across {days} UTC dates; holdout_ready={result}")
          print("true" if result else "false")
          PY
          | tail -n 1)
          if [ "$ready" = "true" ]; then
            python -m scripts.market_move_discovery --db /tmp/market_microstructure_merged.sqlite3 --output /tmp/market_move_discovery_multiday.json
            python -m scripts.market_pattern_mining --db /tmp/market_microstructure_merged.sqlite3 --output /tmp/market_patterns_multiday.json --min-support 5
            python -m scripts.market_pattern_holdout --db /tmp/market_microstructure_merged.sqlite3 --output /tmp/market_pattern_holdout_multiday.json --train-fraction 0.70 --min-support 5
          else
            echo "More daily captures are required before holdout analysis."
          fi
      - name: Upload merged multi-day research database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-microstructure-multiday-aggregate
          path: |
            /tmp/market_microstructure_merged.sqlite3
            /tmp/microstructure_merge_report.json
            /tmp/market_move_discovery_multiday.json
            /tmp/market_patterns_multiday.json
            /tmp/market_pattern_holdout_multiday.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload raw research database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-microstructure-capture
          path: /tmp/market_microstructure.sqlite3
          retention-days: 30
          if-no-files-found: warn
      - name: Upload event-study report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bingx-microstructure-event-study
          path: /tmp/microstructure_event_study.json
          retention-days: 14
          if-no-files-found: warn
