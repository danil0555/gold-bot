name: Python validation

concurrency:
  group: addon-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [fix/addon-strategies-diagnostics-20261121, research/b-only-validation-clean]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install runtime and strategy test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Import runtime and verify safe defaults
        env:
          BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
          DB_PATH: /tmp/trading_bot_ci_smoke.db
          BACKUP_DIR: /tmp/trading_bot_ci_backups
        run: python -c "import main; assert main.REAL_TRADING_ENABLED is False; assert main.ENABLE_ADDON_STRATEGIES is False; assert main.RISK_PERCENT == 2.0; assert main.FUTURES_LEVERAGE == 5; print('runtime import OK; real orders OFF; add-ons OFF')"
      - name: Run isolated 30-day production B strategy portfolio backtest
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/research/b-only-validation-clean'
        run: python scripts/backtest_scalping_100.py --days 30 --symbols BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,ADA-USDT,DOGE-USDT,LINK-USDT,LTC-USDT --deposit 100 --risk-percent 2 --leverage 5 --max-positions 5 --strategies B_STRATEGY
        timeout-minutes: 60
      - name: Run deterministic addon strategy tests
        run: python -m pytest -q tests/test_addon_strategies.py
      - name: Run read-only BingX historical backtest (7 days)
        if: github.event_name == 'push'
        run: python scripts/backtest_addons.py --days 7 --symbols BTC-USDT,ETH-USDT,SOL-USDT
        timeout-minutes: 20
