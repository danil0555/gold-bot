name: Python validation and spot-futures research

concurrency:
  group: addon-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [fix/addon-strategies-diagnostics-20261121, research/spot-futures-arbitrage, research/futures-scalping-100-usdt, research/futures-scalping-30d, research/single-tp-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install runtime and strategy test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Import runtime and verify safe defaults
        env:
          BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
          DB_PATH: /tmp/trading_bot_ci_smoke.db
          BACKUP_DIR: /tmp/trading_bot_ci_backups
        run: python -c "import main; assert main.REAL_TRADING_ENABLED is False; assert main.ENABLE_ADDON_STRATEGIES is False; assert main.RISK_PERCENT == 2.0; assert main.FUTURES_LEVERAGE == 5; print('runtime import OK; real orders OFF; add-ons OFF')"
      - name: Run deterministic addon and arbitrage tests
        run: python -m pytest -q tests/test_addon_strategies.py tests/test_spot_futures_arb.py tests/test_backtest_spot_futures_arb.py tests/test_scalping_100.py tests/test_single_tp.py
      - name: Run read-only public BingX spot-perpetual smoke scan
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/research/spot-futures-arbitrage'
        run: python -m scripts.spot_futures_arb --symbols BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,ADA-USDT,DOGE-USDT,LINK-USDT,LTC-USDT --notional 1000 --funding-periods 3
        timeout-minutes: 5
      - name: Run 180-day read-only spot-perpetual historical backtest
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/research/spot-futures-arbitrage'
        run: python -m scripts.backtest_spot_futures_arb --days 180 --symbols BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,ADA-USDT,DOGE-USDT,LINK-USDT,LTC-USDT --notional 1000
        timeout-minutes: 15
      - name: Run read-only BingX historical backtest (7 days)
        if: github.ref == 'refs/heads/fix/addon-strategies-diagnostics-20261121'
        run: python scripts/backtest_addons.py --days 7 --symbols BTC-USDT,ETH-USDT,SOL-USDT
        timeout-minutes: 20
      - name: Run $100 USDT-M futures scalping portfolio backtest (30-day validation)
        if: github.ref == 'refs/heads/research/futures-scalping-100-usdt' || github.ref == 'refs/heads/research/futures-scalping-30d'
        run: python scripts/backtest_scalping_100.py --days 30 --symbols BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,ADA-USDT,DOGE-USDT,LINK-USDT,LTC-USDT --deposit 100 --risk-percent 2 --leverage 5 --max-positions 5
        timeout-minutes: 60
      - name: Run Strategy B single-take-profit sweep (30-day research)
        if: github.ref == 'refs/heads/research/single-tp-validation'
        run: python scripts/backtest_single_tp.py --days 30 --symbols BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,ADA-USDT,DOGE-USDT,LINK-USDT,LTC-USDT --deposit 100 --risk-percent 2 --leverage 5 --max-positions 5 --target-rs 1.5,1.8,2.1,2.4,2.7,3.0
        timeout-minutes: 60
