name: Python validation

concurrency:
  group: addon-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [fix/addon-strategies-diagnostics-20261121]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install strategy test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Run deterministic addon strategy tests
        run: python -m pytest -q tests/test_addon_strategies.py
      - name: Run read-only BingX historical backtest (7 days)
        if: github.event_name == 'push'
        run: python scripts/backtest_addons.py --days 7 --symbols BTC-USDT,ETH-USDT,SOL-USDT
        timeout-minutes: 20
