name: Python validation

concurrency:
  group: addon-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [fix/addon-strategies-diagnostics-20261121, release/v10.2.3-candidate]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install runtime and strategy test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Import runtime and verify safe defaults
        env:
          BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
          DB_PATH: /tmp/trading_bot_ci_smoke.db
          BACKUP_DIR: /tmp/trading_bot_ci_backups
        run: python -c "import main; assert main.REAL_TRADING_ENABLED is False; assert main.ENABLE_ADDON_STRATEGIES is False; assert main.RISK_PERCENT == 10.0; assert main.FUTURES_LEVERAGE == 5; print('runtime import OK; real orders OFF; add-ons OFF')"
      - name: Run deterministic addon strategy tests
        run: python -m pytest -q tests/test_addon_strategies.py tests/test_reliability.py tests/test_api_retry.py
      - name: Run read-only BingX historical backtest (7 days)
        if: github.ref == 'refs/heads/fix/addon-strategies-diagnostics-20261121'
        run: python scripts/backtest_addons.py --days 7 --symbols BTC-USDT,ETH-USDT,SOL-USDT
        timeout-minutes: 20
