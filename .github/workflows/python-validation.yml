name: Python validation and market research

concurrency:
  group: addon-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [fix/addon-strategies-diagnostics-20261121, research/spot-futures-arbitrage, research/futures-scalping-100-usdt, research/market-discovery-engine, research/live-market-data-collector, research/live-market-data-candles, research/futures-scalping-30d, research/market-feature-ablation, research/bingx-funding-regimes]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install runtime, research and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest scikit-learn
      - name: Import runtime and verify safe defaults
        env:
          BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
          DB_PATH: /tmp/trading_bot_ci_smoke.db
          BACKUP_DIR: /tmp/trading_bot_ci_backups
        run: python -c "import main; assert main.REAL_TRADING_ENABLED is False; assert main.ENABLE_ADDON_STRATEGIES is False; assert main.RISK_PERCENT == 2.0; assert main.FUTURES_LEVERAGE == 5; print('runtime import OK; real orders OFF; add-ons OFF')"
      - name: Run deterministic strategy and research tests
        run: python -m pytest -q tests/test_addon_strategies.py tests/test_spot_futures_arb.py tests/test_backtest_spot_futures_arb.py tests/test_scalping_100.py tests/test_market_research.py tests/test_market_data_collector.py
      - name: Smoke test live BingX market-data collector
        if: github.ref == 'refs/heads/research/live-market-data-collector' || github.ref == 'refs/heads/research/live-market-data-candles'
        run: |
          python scripts/market_data_collector.py --symbols BTC-USDT,ETH-USDT --duration-hours 0.05 --db-path /tmp/market_microstructure.sqlite3 --derivatives-interval 60
          python -c "import sqlite3; c=sqlite3.connect('/tmp/market_microstructure.sqlite3'); n=c.execute('select count(*) from minute_features').fetchone()[0]; d=c.execute('select coalesce(sum(depth_samples),0) from minute_features').fetchone()[0]; t=c.execute('select coalesce(sum(trades_count),0) from minute_features').fetchone()[0]; oi=c.execute('select count(*) from derivatives_snapshots').fetchone()[0]; candles=c.execute('select count(*) from minute_candles').fetchone()[0]; events=c.execute('select event_type, count(*) from collector_events group by event_type').fetchall(); print('minute_rows=',n,'depth_samples=',d,'trades=',t,'derivatives_rows=',oi,'candle_rows=',candles,'events=',events); assert n>0 and d>0 and t>0 and oi>0 and candles>0"
        timeout-minutes: 5
      - name: Run read-only public BingX spot-perpetual smoke scan
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/research/spot-futures-arbitrage'
        run: python -m scripts.spot_futures_arb --symbols BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,ADA-USDT,DOGE-USDT,LINK-USDT,LTC-USDT --notional 1000 --funding-periods 3
        timeout-minutes: 5
      - name: Run 180-day read-only spot-perpetual historical backtest
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/research/spot-futures-arbitrage'
        run: python -m scripts.backtest_spot_futures_arb --days 180 --symbols BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,ADA-USDT,DOGE-USDT,LINK-USDT,LTC-USDT --notional 1000
        timeout-minutes: 15
      - name: Run read-only BingX historical backtest (7 days)
        if: github.ref == 'refs/heads/fix/addon-strategies-diagnostics-20261121'
        run: python scripts/backtest_addons.py --days 7 --symbols BTC-USDT,ETH-USDT,SOL-USDT
        timeout-minutes: 20
      - name: Run $100 USDT-M futures scalping portfolio backtest
        if: github.ref == 'refs/heads/research/futures-scalping-100-usdt'
        run: python scripts/backtest_scalping_100.py --days 7 --symbols BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,ADA-USDT,DOGE-USDT,LINK-USDT,LTC-USDT --deposit 100 --risk-percent 2 --leverage 5 --max-positions 5
        timeout-minutes: 30
      - name: Run 180-day cross-sectional market research
        if: github.ref == 'refs/heads/research/market-discovery-engine'
        run: python scripts/market_research.py --days 180 --universe 30 --min-quote-volume 5000000 --cost-bps 12 --threshold 0.58
        timeout-minutes: 60
      - name: Upload research report
        if: always() && github.ref == 'refs/heads/research/market-discovery-engine'
        uses: actions/upload-artifact@v4
        with:
          name: market-research-180d
          path: research-output/market_research_180d.json
          if-no-files-found: warn
